name: check

# Verifies this family on every push: parsing tests on saved pages (pytest), then scrape-check, which runs setup_family.py and the
# crawl task against a local stand-in for scrape-hub, the same way the pool runner does, on 2 real queue items (and a rerun).
# Nothing reaches the real hub. Run it by hand too: Actions -> check -> Run workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt pytest "scrape-hub-client @ git+https://github.com/s1d-labs/runner@sdk-stable#subdirectory=sdk"
          python3 -c "import json; [print(c) for c in json.load(open('scrape.json')).get('setup', [])]" | grep -v "requirements.txt" | while IFS= read -r cmd; do bash -c "$cmd"; done
      - name: Parsing tests
        run: python -m pytest tests -q
      - name: Reachability from this GitHub runner (no proxy)
        id: reach
        run: |
          python crawl.py --local "https://locate.cisce.org/?page=1" > reach.jsonl 2> reach.log || true
          cat reach.log
          n=$(wc -l < reach.jsonl)
          echo "records=$n" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] || echo "::warning::locate.cisce.org did not let the runner through (Cloudflare challenge?)"
      - name: scrape-check, history task (local stand-in hub, 2 cached locator pages)
        run: scrape-check --items 2 --project cisce-scraper-locator-cache
      - name: scrape-check, Gujarat FRC list (2 real pages; a dead or blocking site gives a warning, not a red PR)
        continue-on-error: true
        run: scrape-check --items 2 --project cisce-scraper-frc-gujarat || { echo "::warning::frcgujarat.org check failed from this runner (site down, or it refuses GitHub runners: then use proxy=IN)"; exit 1; }
      # the locator project has no queue items while Cloudflare blocks it (family.py PAGES = 0): add
      # `scrape-check --items 2 --project cisce-scraper-schools` here again when PAGES > 0
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: scrape-check
          path: .scrape-check/
          if-no-files-found: ignore
